<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flavo SMP | Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #20110b 0%, #121214 65%, #0a0a0c 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      color: #ffffff;
    }

    .container {
      max-width: 850px;
      width: 100%;
    }

    /* Base Dark Card Styling */
    .card {
      background: linear-gradient(145deg, rgba(38, 38, 42, 0.9) 0%, rgba(20, 20, 24, 0.95) 100%);
      border: 1.5px solid rgba(255, 85, 0, 0.3);
      border-radius: 24px;
      padding: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
    }

    .card:hover {
      border-color: rgba(255, 85, 0, 0.55);
    }

    /* Main Grid Area */
    .main-content {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    /* Store Banner Card */
    .store-card {
      grid-column: span 2;
      min-height: 220px;
      background: linear-gradient(145deg, rgba(38, 38, 42, 0.9) 0%, rgba(20, 20, 24, 0.95) 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-heading {
      font-size: 2.2rem;
      font-weight: 900;
      color: #ffffff;
    }

    .store-btn-container {
      display: flex;
      justify-content: flex-end;
    }

    .btn-orange {
      background: linear-gradient(90deg, #ff5e00, #ff2a00);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(255, 68, 0, 0.5);
      transition: all 0.2s ease;
    }

    .btn-orange:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 68, 0, 0.7);
    }

    /* Link Creator Card */
    .link-creator-card {
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .status-badge {
      align-self: flex-start;
      background: rgba(10, 10, 12, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #ffab00;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffab00;
    }

    /* How to Join Tutorial Card */
    .join-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .info-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .info-label {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #7b7980;
      text-transform: uppercase;
    }

    .info-input {
      background: #0d0d0f;
      border: 1px solid rgba(255, 85, 0, 0.35);
      border-radius: 10px;
      padding: 12px 16px;
      font-family: 'Space Mono', monospace;
      color: #ff9d00;
      font-weight: 700;
      font-size: 0.9rem;
    }

    /* Mobile Scaling */
    @media (max-width: 650px) {
      .main-content {
        grid-template-columns: 1fr;
      }
      .store-card {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="main-content">
      
      <div class="card store-card">
        <h2 class="card-heading">Store</h2>
        <div class="store-btn-container">
          <a href="#" class="btn-orange">BROWSE PACKS &rsaquo;</a>
        </div>
      </div>

      <div class="card link-creator-card">
        <h2 class="card-heading">Link Creator</h2>
        <div class="status-badge">
          <span class="status-dot"></span>
          Ready to generate
        </div>
      </div>

      <div class="card join-card">
        <h2 class="card-heading" style="font-size: 1.5rem;">How To Join</h2>
        
        <div class="info-group">
          <span class="info-label">SERVER NAME</span>
          <div class="info-input">Flavo SMP_</div>
        </div>

        <div class="info-group">
          <span class="info-label">SERVER IP</span>
          <div class="info-input">flavosmp.minehut.gg</div>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
