<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flavo SMP | Official Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      /* Fiery Volcanic Background from Unsplash */
      background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.75)), 
                  url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920&auto=format&fit=crop') center/cover fixed no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      color: #ffffff;
    }

    .container {
      max-width: 1050px;
      width: 100%;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
    }

    /* Base Glassmorphic Card Styling */
    .card {
      background: rgba(18, 12, 10, 0.75);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 68, 0, 0.35);
      border-radius: 20px;
      padding: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      transition: border-color 0.3s ease, transform 0.2s ease;
    }

    .card:hover {
      border-color: rgba(255, 94, 0, 0.7);
    }

    /* Left Sidebar Column */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .brand-card {
      background: linear-gradient(145deg, #c72c00 0%, #831500 100%);
      border: 1.5px solid rgba(255, 120, 50, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 55px 20px;
      text-align: center;
    }

    .flame-icon {
      width: 70px;
      height: 70px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .flame-icon svg {
      width: 40px;
      height: 40px;
      fill: none;
      stroke: #ffab00;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .brand-title {
      font-size: 1.9rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
    }

    .ip-box {
      background: rgba(10, 6, 5, 0.85);
      border: 1.5px solid rgba(255, 80, 0, 0.4);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .ip-box:hover {
      background: rgba(255, 68, 0, 0.15);
      transform: translateY(-2px);
    }

    .ip-text {
      font-family: 'Space Mono', monospace;
      color: #ffffff;
    }

    /* Right Grid Area */
    .main-content {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Store Banner Card */
    .store-card {
      min-height: 240px;
      /* High-quality fire render image */
      background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.75)), 
                  url('https://images.unsplash.com/photo-1542224566-6e85f2e6772f?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
    }

    .card-heading {
      font-size: 2.2rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    .store-btn-container {
      display: flex;
      justify-content: flex-end;
    }

    .btn-orange {
      background: linear-gradient(90deg, #ff5e00, #ff2a00);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(255, 68, 0, 0.4);
      transition: all 0.2s ease;
    }

    .btn-orange:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 68, 0, 0.6);
    }

    /* Link Creator Card */
    .link-creator-card {
      min-height: 200px;
      /* High-quality lava / ember graphic */
      background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.85)), 
                  url('https://images.unsplash.com/photo-1508739773434-c26b3d09e071?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .status-badge {
      align-self: flex-start;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #ffab00;
      border-radius: 50%;
      box-shadow: 0 0 8px #ffab00;
    }

    /* Mobile scaling */
    @media (max-width: 850px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="sidebar">
      <div class="card brand-card">
        <div class="flame-icon">
          <svg viewBox="0 0 24 24">
            <path d="M8.5 14.5A2.5 2.5 0 0 0 11 17c1.38 0 2.5-1.12 2.5-2.5c0-1.99-1.25-3.57-2.5-5.5c-1.25 1.93-2.5 3.51-2.5 5.5Z"/>
            <path d="M12 2C6.5 7.5 4 11 4 15a8 8 0 0 0 16 0c0-4-2.5-7.5-8-13Z"/>
          </svg>
        </div>
        <h1 class="brand-title">FLAVO SMP</h1>
      </div>

      <div class="ip-box" onclick="copyIp()">
        📋 <span class="ip-text" id="ipDisplay">flavosmp.minehut.gg</span>
      </div>
    </div>

    <div class="main-content">
      
      <div class="card store-card">
        <h2 class="card-heading">Store</h2>
        <div class="store-btn-container">
          <a href="#" class="btn-orange">BROWSE PACKS &rsaquo;</a>
        </div>
      </div>

      <div class="card link-creator-card">
        <h2 class="card-heading">Link Creator</h2>
        <div class="status-badge">
          <span class="status-dot"></span>
          Ready to generate
        </div>
      </div>

    </div>

  </div>

  <script>
    function copyIp() {
      const ip = document.getElementById('ipDisplay').innerText;
      navigator.clipboard.writeText(ip);
      alert('Copied IP: ' + ip);
    }
  </script>

</body>
</html>
