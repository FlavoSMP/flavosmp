<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flavo SMP | Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      /* Pure CSS background glow & dark gradient */
      background: radial-gradient(circle at 50% 20%, #2a1107 0%, #121214 60%, #0a0a0c 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      color: #ffffff;
    }

    .container {
      max-width: 1050px;
      width: 100%;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 20px;
    }

    /* Base Glassmorphic Card (CSS Only) */
    .card {
      background: linear-gradient(135deg, rgba(38, 38, 42, 0.85) 0%, rgba(22, 22, 25, 0.9) 100%);
      border: 1.5px solid rgba(255, 85, 0, 0.25);
      border-radius: 24px;
      padding: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card:hover {
      border-color: rgba(255, 85, 0, 0.5);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6),
                  0 0 25px rgba(255, 85, 0, 0.15);
    }

    /* Left Sidebar Column */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .brand-card {
      background: linear-gradient(145deg, #c42b00 0%, #701300 100%);
      border: 1.5px solid rgba(255, 120, 50, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(196, 43, 0, 0.35);
    }

    .flame-icon {
      width: 64px;
      height: 64px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }

    .flame-icon svg {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: #ffa200;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .brand-title {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #ffffff;
    }

    .ip-box {
      background: rgba(18, 18, 20, 0.95);
      border: 1.5px solid rgba(255, 85, 0, 0.3);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .ip-box:hover {
      background: rgba(255, 85, 0, 0.12);
      border-color: rgba(255, 85, 0, 0.6);
      transform: translateY(-2px);
    }

    .ip-text {
      font-family: 'Space Mono', monospace;
      color: #ffffff;
    }

    /* Right Grid Area */
    .main-content {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: auto auto;
      gap: 16px;
    }

    /* Store Banner Card */
    .store-card {
      grid-column: span 2;
      min-height: 220px;
      /* CSS Lava Radial Gradient Glow */
      background: radial-gradient(circle at 90% 10%, rgba(255, 85, 0, 0.15) 0%, transparent 60%),
                  linear-gradient(135deg, rgba(38, 38, 42, 0.85) 0%, rgba(22, 22, 25, 0.9) 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-heading {
      font-size: 2.2rem;
      font-weight: 900;
      color: #ffffff;
    }

    .store-btn-container {
      display: flex;
      justify-content: flex-end;
    }

    .btn-orange {
      background: linear-gradient(90deg, #ff5e00, #ff2a00);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(255, 68, 0, 0.5);
      transition: all 0.2s ease;
    }

    .btn-orange:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 68, 0, 0.7);
    }

    /* Link Creator Card */
    .link-creator-card {
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .status-badge {
      align-self: flex-start;
      background: rgba(10, 10, 12, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #ffab00;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffab00;
    }

    /* How to Join Card */
    .join-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .info-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .info-label {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #7b7980;
      text-transform: uppercase;
    }

    .info-input {
      background: #0d0d0f;
      border: 1px solid rgba(255, 85, 0, 0.35);
      border-radius: 10px;
      padding: 12px 16px;
      font-family: 'Space Mono', monospace;
      color: #ff9d00;
      font-weight: 700;
      font-size: 0.9rem;
    }

    /* Responsive scaling */
    @media (max-width: 850px) {
      .container {
        grid-template-columns: 1fr;
      }
      .main-content {
        grid-template-columns: 1fr;
      }
      .store-card {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="sidebar">
      <div class="card brand-card">
        <div class="flame-icon">
          <svg viewBox="0 0 24 24">
            <path d="M8.5 14.5A2.5 2.5 0 0 0 11 17c1.38 0 2.5-1.12 2.5-2.5c0-1.99-1.25-3.57-2.5-5.5c-1.25 1.93-2.5 3.51-2.5 5.5Z"/>
            <path d="M12 2C6.5 7.5 4 11 4 15a8 8 0 0 0 16 0c0-4-2.5-7.5-8-13Z"/>
          </svg>
        </div>
        <h1 class="brand-title">FLAVO SMP</h1>
      </div>

      <div class="ip-box" onclick="copyIp()">
        📋 <span class="ip-text" id="ipDisplay">flavosmp.minehut.gg</span>
      </div>
    </div>

    <div class="main-content">
      
      <div class="card store-card">
        <h2 class="card-heading">Store</h2>
        <div class="store-btn-container">
          <a href="#" class="btn-orange">BROWSE PACKS &rsaquo;</a>
        </div>
      </div>

      <div class="card link-creator-card">
        <h2 class="card-heading">Link Creator</h2>
        <div class="status-badge">
          <span class="status-dot"></span>
          Ready to generate
        </div>
      </div>

      <div class="card join-card">
        <h2 class="card-heading" style="font-size: 1.5rem;">How To Join</h2>
        
        <div class="info-group">
          <span class="info-label">SERVER NAME</span>
          <div class="info-input">Flavo SMP_</div>
        </div>

        <div class="info-group">
          <span class="info-label">SERVER IP</span>
          <div class="info-input">flavosmp.minehut.gg</div>
        </div>
      </div>

    </div>

  </div>

  <script>
    function copyIp() {
      const ip = document.getElementById('ipDisplay').innerText;
      navigator.clipboard.writeText(ip);
      alert('Copied IP: ' + ip);
    }
  </script>

</body>
</html>
