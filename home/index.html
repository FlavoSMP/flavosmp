<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flavo SMP | Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      /* Fiery dark background atmosphere */
      background: radial-gradient(circle at 50% 20%, #3a0d02 0%, #150603 55%, #080302 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      color: #ffffff;
    }

    .container {
      max-width: 850px;
      width: 100%;
    }

    /* Base Fire Card Styling */
    .card {
      border-radius: 24px;
      padding: 24px;
      position: relative;
      overflow: hidden;
      border: 1.5px solid rgba(255, 100, 0, 0.45);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7),
                  0 0 20px rgba(255, 60, 0, 0.15),
                  inset 0 1px 1px rgba(255, 180, 100, 0.3);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card:hover {
      border-color: rgba(255, 120, 0, 0.8);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.8),
                  0 0 30px rgba(255, 80, 0, 0.35),
                  inset 0 1px 2px rgba(255, 200, 120, 0.5);
      transform: translateY(-2px);
    }

    /* Main Grid Area */
    .main-content {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    /* Card 1: Main Store Banner (Blaze Gradient) */
    .store-card {
      grid-column: span 2;
      min-height: 220px;
      background: linear-gradient(135deg, #d63000 0%, #850f00 45%, #240500 90%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-heading {
      font-size: 2.2rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    .store-btn-container {
      display: flex;
      justify-content: flex-end;
    }

    .btn-orange {
      background: linear-gradient(90deg, #ff6a00, #ff2a00);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(255, 75, 0, 0.6);
      border: 1px solid rgba(255, 180, 100, 0.4);
      transition: all 0.2s ease;
    }

    .btn-orange:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(255, 90, 0, 0.8);
    }

    /* Card 2: Link Creator (Clickable Link Card) */
    .link-creator-card {
      min-height: 180px;
      background: linear-gradient(135deg, #b82600 0%, #630c00 50%, #1a0300 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      cursor: pointer;
    }

    .status-badge {
      align-self: flex-start;
      background: rgba(15, 3, 1, 0.75);
      border: 1px solid rgba(255, 120, 40, 0.35);
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #ffab00;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffab00;
    }

    /* Card 3: How to Join (Magma Flame Gradient) */
    .join-card {
      background: linear-gradient(135deg, #a31d00 0%, #540700 50%, #150200 100%);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .info-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .info-label {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ff9d76;
      text-transform: uppercase;
    }

    .info-input {
      background: rgba(10, 2, 1, 0.85);
      border: 1px solid rgba(255, 90, 0, 0.45);
      border-radius: 10px;
      padding: 12px 16px;
      font-family: 'Space Mono', monospace;
      color: #ffaa00;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    /* Mobile Scaling */
    @media (max-width: 650px) {
      .main-content {
        grid-template-columns: 1fr;
      }
      .store-card {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="main-content">
      
      <div class="card store-card">
        <h2 class="card-heading">Store</h2>
        <div class="store-btn-container">
          <a href="#" class="btn-orange">BROWSE PACKS &rsaquo;</a>
        </div>
      </div>

      <a href="../link/index.html" class="card link-creator-card">
        <h2 class="card-heading">Link Creator</h2>
        <div class="status-badge">
          <span class="status-dot"></span>
          Ready to generate &rsaquo;
        </div>
      </a>

      <div class="card join-card">
        <h2 class="card-heading" style="font-size: 1.5rem;">How To Join</h2>
        
        <div class="info-group">
          <span class="info-label">SERVER NAME</span>
          <div class="info-input">Flavo SMP_</div>
        </div>

        <div class="info-group">
          <span class="info-label">SERVER IP</span>
          <div class="info-input">flavosmp.minehut.gg</div>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
