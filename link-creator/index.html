<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flavo SMP | Link Creator Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 50% 20%, #3a0d02 0%, #150603 55%, #080302 100%);
            color: #ffffff;
            display: flex;
            margin: 0;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 340px;
            background: rgba(15, 3, 1, 0.9);
            border-right: 1.5px solid rgba(255, 100, 0, 0.3);
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sidebar h3 {
            color: #ff9d76;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 90, 0, 0.25);
            padding-bottom: 12px;
        }

        .back-home {
            color: #ffaa00;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 4px;
            transition: color 0.2s;
        }

        .back-home:hover {
            color: #ffffff;
        }

        .link-card {
            background: rgba(30, 8, 3, 0.8);
            padding: 14px 16px;
            border-radius: 14px;
            cursor: pointer;
            border: 1px solid rgba(255, 90, 0, 0.35);
            transition: all 0.2s ease;
        }

        .link-card:hover {
            background: rgba(50, 12, 4, 0.9);
            border-color: rgba(255, 130, 0, 0.8);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 60, 0, 0.2);
        }

        .link-card strong {
            color: #ffffff;
            font-size: 0.95rem;
        }

        .link-card small {
            color: #ff9d76;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
        }

        /* Main Section Styling */
        .main {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .panel {
            background: linear-gradient(135deg, #a31d00 0%, #540700 50%, #150200 100%);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 460px;
            border: 1.5px solid rgba(255, 100, 0, 0.45);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7),
                        0 0 20px rgba(255, 60, 0, 0.15);
            text-align: center;
        }

        .panel h2 {
            margin-top: 0;
            font-size: 2rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
        }

        .panel p {
            color: #ff9d76;
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            background: rgba(10, 2, 1, 0.85);
            border: 1px solid rgba(255, 90, 0, 0.45);
            border-radius: 12px;
            padding: 14px 16px;
            font-family: 'Space Mono', monospace;
            color: #ffaa00;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 16px;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        input:focus {
            border-color: #ff6a00;
        }

        button {
            width: 100%;
            background: linear-gradient(90deg, #ff6a00, #ff2a00);
            color: #ffffff;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 180, 100, 0.4);
            cursor: pointer;
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(255, 75, 0, 0.6);
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(255, 90, 0, 0.8);
        }

        #status-msg {
            font-size: 0.85rem;
            margin-top: 18px;
            min-height: 24px;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                max-height: 250px;
            }
            .main {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <a href="../" class="home-link">&lsaquo; Back to Home</a>
        <h3>Available Links</h3>
        <div id="sidebar-links" style="color: #b9bbbe; font-size: 0.85rem;">Loading links...</div>
    </div>

    <div class="main">
        <div class="panel">
            <h2>Link Creator</h2>
            <p>Generate a new link code saved directly to MongoDB.</p>
            <input type="text" id="server-name" placeholder="Enter Minecraft Server Name">
            <button onclick="createLink()">Generate Link Code</button>
            <div id="status-msg"></div>
        </div>
    </div>

    <script>
        // Pipedream Webhook URL
        const PIPEDREAM_API = "https://eoed3phjmlklizm.m.pipedream.net";

        async function fetchLinks() {
            const container = document.getElementById('sidebar-links');
            try {
                const res = await fetch(`${PIPEDREAM_API}?action=get_links`);
                const data = await res.json();

                if (data.success && data.links && data.links.length > 0) {
                    container.innerHTML = data.links.map(l => `
                        <div class="link-card" onclick="verifyDiscord('${l.code}', '${l.serverName}')">
                            <strong>${l.serverName}</strong><br>
                            <small>Code: ${l.code}</small>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = "<p style='color: #ff9d76; font-size: 0.85rem;'>No active links found.</p>";
                }
            } catch (err) {
                console.error("Fetch error:", err);
                container.innerHTML = "<p style='color: #ff4747; font-size: 0.85rem;'>Failed to load links.</p>";
            }
        }

        async function createLink() {
            const serverNameInput = document.getElementById('server-name');
            const serverName = serverNameInput.value.trim();
            const statusMsg = document.getElementById('status-msg');

            if (!serverName) {
                statusMsg.style.color = "#ff4747";
                statusMsg.innerText = "⚠️ Please enter a server name.";
                return;
            }

            statusMsg.style.color = "#ffaa00";
            statusMsg.innerText = "Saving to database...";

            try {
                const res = await fetch(PIPEDREAM_API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action: "create_link", serverName })
                });
                const data = await res.json();

                if (data.success) {
                    statusMsg.style.color = "#43b581";
                    statusMsg.innerText = `✅ Created code: ${data.code}`;
                    serverNameInput.value = "";
                    fetchLinks(); // Refresh sidebar list instantly
                } else {
                    statusMsg.style.color = "#ff4747";
                    statusMsg.innerText = data.message || "❌ Error saving link.";
                }
            } catch (err) {
                console.error("Create error:", err);
                statusMsg.style.color = "#ff4747";
                statusMsg.innerText = "❌ Network error reaching backend.";
            }
        }

        function verifyDiscord(code, serverName) {
            const clientId = "1531405277440639086"; // Replace with your actual Discord Bot Client ID when ready
            const redirectUri = encodeURIComponent(window.location.href);
            window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${clientId}&redirect_uri=${redirectUri}&response_type=code&scope=identify%20guilds&state=${code}`;
        }

        // Load links when page first loads
        fetchLinks();
    </script>
</body>
</html>
