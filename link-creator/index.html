<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlavoSMP - Server Linker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700">
        <h1 class="text-2xl font-bold mb-2 text-center text-indigo-400">FlavoSMP Linker</h1>
        <p class="text-slate-400 text-sm mb-6 text-center">Link your Minecraft server to your Discord community.</p>

        <div id="create-section">
            <div class="mb-4">
                <label class="block text-sm font-medium mb-2" for="serverName">Minecraft Server Name</label>
                <input type="text" id="serverName" placeholder="e.g. MyAwesomeSMP" 
                    class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500">
            </div>
            <button onclick="createLink()" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg transition">
                Generate Link Code
            </button>
        </div>

        <div id="result-section" class="hidden text-center mt-4">
            <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 mb-4">
                <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Your Link Code</p>
                <span id="displayCode" class="text-3xl font-mono font-bold text-emerald-400 tracking-widest">-----</span>
            </div>
            <p class="text-xs text-slate-300 mb-4">
                Go to your Discord server and type:<br>
                <code class="bg-slate-900 px-2 py-1 rounded text-indigo-300 font-mono">/server-link <span class="code-span">CODE</span></code>
            </p>
            <button onclick="resetForm()" class="text-sm text-slate-400 hover:text-white underline">Create another code</button>
        </div>

        <div id="loading" class="hidden text-center py-4 text-indigo-400">Processing...</div>
        <div id="errorMsg" class="hidden text-center mt-4 text-sm text-red-400"></div>
    </div>

    <script>
        const WEBHOOK_URL = "https://eoed3phjmlklizm.m.pipedream.net"; // <-- Paste your Pipedream webhook URL here

        async function createLink() {
            const serverName = document.getElementById('serverName').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const loading = document.getElementById('loading');
            
            errorMsg.classList.add('hidden');
            if (!serverName) {
                errorMsg.textContent = "Please enter a server name.";
                errorMsg.classList.remove('hidden');
                return;
            }

            loading.classList.remove('hidden');

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'create_link', serverName })
                });
                const data = await response.json();
                loading.classList.add('hidden');

                if (data.success) {
                    document.getElementById('create-section').classList.add('hidden');
                    document.getElementById('displayCode').textContent = data.code;
                    document.querySelectorAll('.code-span').forEach(el => el.textContent = data.code);
                    document.getElementById('result-section').classList.remove('hidden');
                } else {
                    errorMsg.textContent = data.message || "Failed to generate code.";
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                loading.classList.add('hidden');
                errorMsg.textContent = "Network error. Check your webhook URL.";
                errorMsg.classList.remove('hidden');
            }
        }

        function resetForm() {
            document.getElementById('serverName').value = '';
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('create-section').classList.remove('hidden');
        }
    </script>
</body>
</html>
