<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlavoSMP - Account & Server Link</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 350px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #5865F2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #4752C4;
        }
        #result-message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>FlavoSMP Link Portal</h2>
        <p>Enter your in-game code below:</p>
        
        <input type="text" id="code-input" placeholder="Enter 5-digit code">
        <button onclick="submitCode()">Link Account / Server</button>
        
        <div id="result-message"></div>
    </div>

    <script>
        async function submitCode() {
            const code = document.getElementById('code-input').value.trim();
            const messageDiv = document.getElementById('result-message');

            if (!code) {
                messageDiv.style.color = '#ff4444';
                messageDiv.innerText = "❌ Please enter a valid code.";
                return;
            }

            messageDiv.style.color = '#ffffff';
            messageDiv.innerText = "Processing...";

            // Replace with your actual Pipedream webhook URL
            const pipedreamURL = "https://eoed3phjmlklizm.m.pipedream.net";

            try {
                const response = await fetch(pipedreamURL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        code: code,
                        // Note: If this page is loaded inside Discord or with context, 
                        // pass user_id and guild_id dynamically. Otherwise, handle server-side or via BotGhost.
                        user_id: "WEB_USER", 
                        guild_id: "WEB_GUILD"
                    })
                });

                const data = await response.json();

                if (data.success) {
                    messageDiv.style.color = '#4BB543';
                    messageDiv.innerText = data.message || "✅ Successfully linked!";
                } else {
                    messageDiv.style.color = '#ff4444';
                    messageDiv.innerText = data.message || "❌ An error occurred.";
                }
            } catch (error) {
                console.error("Error:", error);
                messageDiv.style.color = '#ff4444';
                messageDiv.innerText = "❌ Failed to connect to the server.";
            }
        }
    </script>

</body>
</html>
