<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlavoSMP - Link Creator Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #121212; 
            color: #fff; 
            display: flex; 
            margin: 0; 
            height: 100vh; 
        }
        .sidebar { 
            width: 320px; 
            background: #1e1e1e; 
            border-right: 1px solid #2f3136; 
            padding: 20px; 
            overflow-y: auto; 
        }
        .sidebar h3 {
            margin-top: 0;
            color: #5865F2;
            font-size: 18px;
            border-bottom: 1px solid #2f3136;
            padding-bottom: 10px;
        }
        .main { 
            flex: 1; 
            padding: 40px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }
        .link-card { 
            background: #2f3136; 
            padding: 12px 15px; 
            margin-bottom: 10px; 
            border-radius: 6px; 
            cursor: pointer; 
            border: 1px solid #202225; 
            transition: background 0.2s, border-color 0.2s;
        }
        .link-card:hover { 
            background: #36393f; 
            border-color: #5865F2; 
        }
        .link-card strong {
            color: #ffffff;
            font-size: 15px;
        }
        .link-card small {
            color: #b9bbbe;
        }
        input, button { 
            padding: 12px; 
            margin: 8px 0; 
            width: 100%; 
            border-radius: 6px; 
            border: 1px solid #202225; 
            background: #2f3136; 
            color: #fff; 
            font-size: 14px;
        }
        input:focus {
            border-color: #5865F2;
            outline: none;
        }
        button { 
            background: #5865F2; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            transition: background 0.2s;
        }
        button:hover { 
            background: #4752C4; 
        }
        .panel { 
            background: #1e1e1e; 
            padding: 35px; 
            border-radius: 10px; 
            width: 400px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.6); 
            text-align: center; 
        }
        .panel h2 {
            margin-top: 0;
            color: #5865F2;
        }
        #status-msg { 
            font-size: 13px; 
            margin-top: 15px; 
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>Available Links</h3>
        <div id="sidebar-links">Loading links...</div>
    </div>

    <div class="main">
        <div class="panel">
            <h2>Create Server Link</h2>
            <p style="color: #b9bbbe; font-size: 13px; margin-bottom: 20px;">Generate a new link code saved directly to MongoDB.</p>
            <input type="text" id="server-name" placeholder="Enter Minecraft Server Name">
            <button onclick="createLink()">Generate Link Code</button>
            <div id="status-msg"></div>
        </div>
    </div>

    <script>
        // Your active Pipedream webhook URL
        const PIPEDREAM_API = "https://eoed3phjmlklizm.m.pipedream.net";

        async function fetchLinks() {
            const container = document.getElementById('sidebar-links');
            try {
                const res = await fetch(`${PIPEDREAM_API}?action=get_links`);
                const data = await res.json();

                if (data.success && data.links && data.links.length > 0) {
                    container.innerHTML = data.links.map(l => `
                        <div class="link-card" onclick="verifyDiscord('${l.code}', '${l.serverName}')">
                            <strong>${l.serverName}</strong><br>
                            <small>Code: ${l.code}</small>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = "<p style='color: #888; font-size: 14px; text-align: center;'>No active links found.</p>";
                }
            } catch (err) {
                console.error("Fetch error:", err);
                container.innerHTML = "<p style='color: #f04747; font-size: 14px;'>Failed to load links.</p>";
            }
        }

        async function createLink() {
            const serverNameInput = document.getElementById('server-name');
            const serverName = serverNameInput.value.trim();
            const statusMsg = document.getElementById('status-msg');

            if (!serverName) {
                statusMsg.style.color = "#f04747";
                statusMsg.innerText = "⚠️ Please enter a server name.";
                return;
            }

            statusMsg.style.color = "#b9bbbe";
            statusMsg.innerText = "Saving to database...";

            try {
                const res = await fetch(PIPEDREAM_API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action: "create_link", serverName })
                });
                const data = await res.json();

                if (data.success) {
                    statusMsg.style.color = "#43b581";
                    statusMsg.innerText = `✅ Created code: ${data.code}`;
                    serverNameInput.value = "";
                    fetchLinks(); // Refresh sidebar list instantly
                } else {
                    statusMsg.style.color = "#f04747";
                    statusMsg.innerText = data.message || "❌ Error saving link.";
                }
            } catch (err) {
                console.error("Create error:", err);
                statusMsg.style.color = "#f04747";
                statusMsg.innerText = "❌ Network error reaching backend.";
            }
        }

        function verifyDiscord(code, serverName) {
            const clientId = "YOUR_DISCORD_CLIENT_ID"; // Replace with your Discord Client ID when ready
            const redirectUri = encodeURIComponent(window.location.href);
            window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${clientId}&redirect_uri=${redirectUri}&response_type=code&scope=identify%20guilds&state=${code}`;
        }

        // Load links when page first loads
        fetchLinks();
    </script>
</body>
</html>
