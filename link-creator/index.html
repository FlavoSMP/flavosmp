<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlavoSMP Linker</title>
    <style>
        :root {
            --bg-dark: #0a0505;
            --sidebar-bg: #120909;
            --card-bg: rgba(25, 12, 12, 0.8);
            --fire-main: #ff4500;
            --fire-light: #ff8c00;
            --fire-yellow: #ffcc00;
            --text-main: #ffffff;
            --text-muted: #8c7b7b;
            --border-glow: rgba(255, 69, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at 100% 100%, rgba(255, 69, 0, 0.05), transparent 50%),
                              radial-gradient(circle at 0% 0%, rgba(255, 140, 0, 0.05), transparent 50%);
        }

        /* --- SCROLLBAR STYLING --- */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--fire-main); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--fire-light); }

        /* --- LAYOUT --- */
        .sidebar {
            width: 300px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-glow);
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: 5px 0 25px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .main-content {
            flex: 1;
            padding: 50px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- SIDEBAR --- */
        .sidebar-header {
            padding: 30px 20px;
            border-bottom: 1px solid var(--border-glow);
            text-align: center;
        }

        .sidebar-header h2 {
            background: linear-gradient(90deg, var(--fire-main), var(--fire-yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.8rem;
            text-shadow: 0 0 20px rgba(255, 69, 0, 0.2);
        }

        .new-link-btn {
            display: block;
            width: calc(100% - 40px);
            margin: 20px auto;
            padding: 12px;
            background: transparent;
            border: 2px dashed var(--fire-light);
            color: var(--fire-light);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .new-link-btn:hover {
            background: rgba(255, 140, 0, 0.1);
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.3);
        }

        .server-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .server-item {
            padding: 15px 20px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.2s ease;
        }

        .server-item:hover, .server-item.active {
            background: rgba(255, 69, 0, 0.1);
            border-left: 3px solid var(--fire-main);
        }

        .server-item h4 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .server-item p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.9rem;
        }

        /* --- VIEWS --- */
        .view {
            display: none;
            width: 100%;
            max-width: 650px;
            animation: fadeIn 0.4s ease forwards;
        }

        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- CARDS & FORMS --- */
        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(255, 69, 0, 0.05);
            backdrop-filter: blur(10px);
        }

        .glass-card h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .glass-card p.subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--text-muted);
            border-radius: 8px;
            color: white;
            font-size: 1.1rem;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--fire-main);
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.4);
        }

        .btn-fire {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--fire-main), var(--fire-light));
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 20px rgba(255, 69, 0, 0.4);
        }

        .btn-fire:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 140, 0, 0.6);
        }

        /* --- COMMAND GENERATOR UI --- */
        .command-area {
            background: #000;
            border: 2px solid var(--fire-main);
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .command-area::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            to { left: 200%; }
        }

        .command-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.8rem;
            color: var(--fire-yellow);
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }

        .copy-hint {
            display: block;
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>FlavoSMP</h2>
        </div>
        
        <button class="new-link-btn" onclick="openCreatorView()">+ CREATE NEW LINK</button>
        
        <div class="server-list" id="sidebar-list">
            <div class="empty-state" id="empty-state">
                No servers linked yet. Create one to get started!
            </div>
        </div>
    </div>

    <div class="main-content">
        
        <div id="creator-view" class="view active">
            <div class="glass-card">
                <h1>Create Server Link</h1>
                <p class="subtitle">Generate a secure connection code for your Minecraft server.</p>
                
                <input type="text" id="serverNameInput" placeholder="Enter Server Name (e.g. Flavo SMP)">
                <button class="btn-fire" onclick="simulateCreation()">Generate Link Code</button>
            </div>
        </div>

        <div id="server-view" class="view">
            <div class="glass-card">
                <h1 id="activeServerTitle">Server Name</h1>
                <p class="subtitle">Run this command in your Discord server to link it.</p>

                <div class="command-area">
                    <div class="command-text" id="activeCommandText">/server-link -----</div>
                    <span class="copy-hint">Code expires when used.</span>
                </div>

                <button class="btn-fire" style="background: transparent; border: 2px solid var(--fire-main); box-shadow: none;" onclick="generateNewCodeForActive()">
                    Regenerate Code
                </button>
            </div>
        </div>

    </div>

    <script>
        // Array to store our created servers locally with persistent storage
        let servers = JSON.parse(localStorage.getItem('flavo_servers') || '[]');
        let activeServerIndex = null;

        // DOM Elements
        const sidebarList = document.getElementById('sidebar-list');
        const emptyState = document.getElementById('empty-state');
        const creatorView = document.getElementById('creator-view');
        const serverView = document.getElementById('server-view');

        function saveServers() {
            localStorage.setItem('flavo_servers', JSON.stringify(servers));
        }

        // Functions to Switch Views
        function openCreatorView(pushHistory = true) {
            if (pushHistory) {
                window.history.pushState({}, '', '/flavosmp/link-creator/');
            }
            
            creatorView.classList.add('active');
            serverView.classList.remove('active');
            
            document.querySelectorAll('.server-item').forEach(el => el.classList.remove('active'));
            document.getElementById('serverNameInput').value = '';
        }

        function openServerView(index, pushHistory = true) {
            activeServerIndex = index;
            const srv = servers[index];

            const slug = srv.name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
            
            if (pushHistory) {
                window.history.pushState({}, '', `/flavosmp/link-creator/${slug}`);
            }

            document.getElementById('activeServerTitle').innerText = srv.name;
            document.getElementById('activeCommandText').innerText = `/server-link ${srv.code}`;

            creatorView.classList.remove('active');
            serverView.classList.add('active');
            updateSidebar();
        }

        // --- REAL PIPEDREAM CREATION LOGIC ---
        async function simulateCreation() {
            const input = document.getElementById('serverNameInput');
            const name = input.value.trim();
            if(!name) return alert("Please enter a server name!");

            const btn = document.querySelector('#creator-view .btn-fire');
            const originalText = btn.innerText;
            btn.innerText = "GENERATING...";
            btn.disabled = true;

            try {
                const response = await fetch("https://eoed3phjmlklizm.m.pipedream.net/", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'create_link', serverName: name })
                });
                
                const data = await response.json();

                if (data.success) {
                    servers.push({
                        name: name,
                        code: data.code,
                        status: 'Awaiting Discord Link...'
                    });
                    saveServers();
                    openServerView(servers.length - 1);
                } else {
                    alert("Error: " + (data.message || "Unknown error"));
                }
            } catch (err) {
                alert("Network error. Could not reach Pipedream.");
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        // --- REAL PIPEDREAM REGENERATE LOGIC ---
        async function generateNewCodeForActive() {
            if(activeServerIndex === null) return;
            const srv = servers[activeServerIndex];

            const btn = document.querySelector('#server-view .btn-fire');
            const originalText = btn.innerText;
            btn.innerText = "GENERATING...";
            btn.disabled = true;

            try {
                const response = await fetch("https://eoed3phjmlklizm.m.pipedream.net/", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'create_link', serverName: srv.name })
                });

                const data = await response.json();
                
                if (data.success) {
                    servers[activeServerIndex].code = data.code;
                    saveServers();
                    document.getElementById('activeCommandText').innerText = `/server-link ${data.code}`;
                } else {
                    alert("Error: " + (data.message || "Unknown error"));
                }
            } catch (err) {
                alert("Network error. Could not reach Pipedream.");
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        function updateSidebar() {
            if (servers.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            Array.from(sidebarList.children).forEach(child => {
                if(child.id !== 'empty-state') child.remove();
            });

            servers.forEach((srv, index) => {
                const div = document.createElement('div');
                div.className = `server-item ${index === activeServerIndex ? 'active' : ''}`;
                div.onclick = () => openServerView(index);
                
                div.innerHTML = `
                    <h4>${srv.name}</h4>
                    <p>${srv.status}</p>
                `;
                sidebarList.appendChild(div);
            });
        }

        // --- ROUTING LOGIC ON PAGE LOAD ---
        function handleRoutingOnLoad() {
            const urlParams = new URLSearchParams(window.location.search);
            const redirectPath = urlParams.get('redirect');

            if (redirectPath) {
                window.history.replaceState({}, '', redirectPath);
            }

            const currentPath = window.location.pathname;

            if (currentPath.endsWith('/link-creator/') || currentPath.endsWith('/link-creator')) {
                openCreatorView(false); 
            } else {
                const slug = currentPath.split('/').filter(Boolean).pop();
                const serverIndex = servers.findIndex(srv => {
                    const srvSlug = srv.name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                    return srvSlug === slug;
                });

                if (serverIndex !== -1) {
                    openServerView(serverIndex, false);
                } else {
                    openCreatorView(false);
                }
            }
        }

        updateSidebar();
        handleRoutingOnLoad();
    </script>
</body>
</html>
