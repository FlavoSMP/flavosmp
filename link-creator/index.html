<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FlavoSMP Link Creator</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; margin: 0; height: 100vh; }
        .sidebar { width: 300px; background: #1e1e1e; border-right: 1px solid #333; padding: 20px; overflow-y: auto; }
        .main { flex: 1; padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .link-card { background: #2a2a2a; padding: 12px; margin-bottom: 10px; border-radius: 6px; cursor: pointer; border: 1px solid #444; }
        .link-card:hover { border-color: #5865F2; background: #323232; }
        input, button { padding: 12px; margin: 8px 0; width: 100%; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box; }
        button { background: #5865F2; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #4752C4; }
        .panel { background: #1e1e1e; padding: 30px; border-radius: 10px; width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>Available Links</h3>
        <div id="sidebar-links">Loading links...</div>
    </div>

    <div class="main">
        <div class="panel">
            <h2>Create Server Link</h2>
            <input type="text" id="server-name" placeholder="Enter Minecraft Server Name">
            <button onclick="createLink()">Generate Link Code</button>
            <p id="status-msg" style="font-size: 13px; margin-top: 15px;"></p>
        </div>
    </div>

    <script>
        // Replace with your Pipedream Webhook URL for fetching links
        const PIPEDREAM_API = "https://eoed3phjmlklizm.m.pipedream.net";

        async function fetchLinks() {
            try {
                const res = await fetch(PIPEDREAM_API + "?action=get_links");
                const data = await res.json();
                const container = document.getElementById('sidebar-links');

                if (data.links && data.links.length > 0) {
                    container.innerHTML = data.links.map(l => `
                        <div class="link-card" onclick="verifyDiscord('${l.code}')">
                            <strong>${l.serverName}</strong><br>
                            <small>Code: ${l.code}</small>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = "<p style='color: #888;'>No links available.</p>";
                }
            } catch (err) {
                document.getElementById('sidebar-links').innerText = "Failed to load links.";
            }
        }

        async function createLink() {
            const serverName = document.getElementById('server-name').value.trim();
            const statusMsg = document.getElementById('status-msg');

            if (!serverName) {
                statusMsg.style.color = "#f04747";
                statusMsg.innerText = "⚠️ Please enter a server name.";
                return;
            }

            statusMsg.style.color = "#fff";
            statusMsg.innerText = "Saving to database...";

            try {
                const res = await fetch(PIPEDREAM_API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action: "create_link", serverName })
                });
                const data = await res.json();

                if (data.success) {
                    statusMsg.style.color = "#43b581";
                    statusMsg.innerText = `✅ Created code: ${data.code}`;
                    document.getElementById('server-name').value = "";
                    fetchLinks(); // Refresh sidebar list
                } else {
                    statusMsg.style.color = "#f04747";
                    statusMsg.innerText = "❌ Error saving link.";
                }
            } catch (err) {
                statusMsg.style.color = "#f04747";
                statusMsg.innerText = "❌ Network error.";
            }
        }

        function verifyDiscord(code) {
            // This redirects the user to Discord OAuth2 to check their servers
            const clientId = "1531405277440639086";
            const redirectUri = encodeURIComponent("https://flavosmp.github.io/link-creator/");
            window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${clientId}&redirect_uri=${redirectUri}&response_type=code&scope=identify%20guilds&state=${code}`;
        }

        // Load links when page opens
        fetchLinks();
    </script>
</body>
</html>
