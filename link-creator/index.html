<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FlavoSMP Server Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 50px; }
        .container { max-width: 500px; margin: auto; background: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        ul { list-style-type: none; padding: 0; }
        li { background: #2d2d2d; margin: 10px 0; padding: 12px; border-radius: 5px; font-size: 16px; color: #ffd700; }
        p { color: #b9bbbe; }
    </style>
</head>
<body>

<div class="container">
    <h2>FlavoSMP Server Portal</h2>
    <p>Active Minecraft Servers registered in the database:</p>

    <ul id="server-list">
        <li>Loading servers...</li>
    </ul>

    <p style="margin-top: 20px; font-size: 14px;">
        To link your account, go to Discord and type: <br>
        <code style="background: #2f3136; padding: 4px 8px; border-radius: 4px; color: #00ffcc;">/link &lt;code&gt;</code>
    </p>
</div>

<script>
async function loadServers() {
    try {
        // Replace with your Pipedream URL that fetches the server list
        const response = await fetch("https://https://eoed3phjmlklizm.m.pipedream.net");
        const data = await response.json();
        const listElement = document.getElementById("server-list");
        listElement.innerHTML = "";
        
        if (data.servers && data.servers.length > 0) {
            data.servers.forEach(server => {
                let li = document.createElement("li");
                li.textContent = `🖥️ ${server.name}`;
                listElement.appendChild(li);
            });
        } else {
            listElement.innerHTML = "<li>FlavoSMP (Default)</li>";
        }
    } catch (e) {
        console.error("Could not load servers", e);
        document.getElementById("server-list").innerHTML = "<li>❌ Failed to load servers.</li>";
    }
}

window.onload = loadServers;
</script>

</body>
</html>
